<svg width="1200" height="350" viewBox="0 0 1200 350" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#030712"/>
<stop offset="50%" stop-color="#07131f"/>
<stop offset="100%" stop-color="#000000"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="4" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0 L0 0 0 40"
fill="none"
stroke="#00ff88"
stroke-width="0.6"/>
</pattern>

</defs>

<style>

.title{
font-family:Arial,sans-serif;
font-size:64px;
font-weight:bold;
fill:#00ff88;
filter:url(#glow);
}

.sub{
font-family:Courier New,monospace;
font-size:22px;
fill:#00d9ff;
}

.term{
font-family:Courier New,monospace;
font-size:18px;
fill:#00ff88;
}

.small{
font-family:Courier New,monospace;
font-size:15px;
fill:#00ff88;
}

.binary{
font-family:monospace;
font-size:14px;
fill:#00ff88;
opacity:.10;
}

</style>

<!-- Background -->

<rect width="1200" height="350" fill="url(#bg)"/>

<!-- Grid -->

<rect width="1200" height="350" fill="url(#grid)" opacity=".15"/>

<!-- Matrix Rain -->

<g class="binary">

<text x="50">
010101010101010101
<animate attributeName="y" values="-100;400" dur="7s" repeatCount="indefinite"/>
</text>

<text x="180">
110011001100110011
<animate attributeName="y" values="-200;400" dur="9s" repeatCount="indefinite"/>
</text>

<text x="320">
111100001111000011
<animate attributeName="y" values="-120;400" dur="8s" repeatCount="indefinite"/>
</text>

<text x="470">
101010101010101010
<animate attributeName="y" values="-180;400" dur="6s" repeatCount="indefinite"/>
</text>

<text x="620">
001100110011001100
<animate attributeName="y" values="-90;400" dur="10s" repeatCount="indefinite"/>
</text>

<text x="780">
111111000000111111
<animate attributeName="y" values="-250;400" dur="8s" repeatCount="indefinite"/>
</text>

<text x="950">
101101101101101101
<animate attributeName="y" values="-140;400" dur="7s" repeatCount="indefinite"/>
</text>

<text x="1090">
010101110001010101
<animate attributeName="y" values="-210;400" dur="9s" repeatCount="indefinite"/>
</text>

</g>

<!-- HUD Border -->

<rect
x="15"
y="15"
width="1170"
height="320"
rx="12"
fill="none"
stroke="#00ff88"
stroke-width="2"
opacity=".7"/>

<!-- HUD Corners -->

<line x1="15" y1="15" x2="90" y2="15" stroke="#00ff88" stroke-width="3"/>
<line x1="15" y1="15" x2="15" y2="90" stroke="#00ff88" stroke-width="3"/>

<line x1="1185" y1="15" x2="1110" y2="15" stroke="#00ff88" stroke-width="3"/>
<line x1="1185" y1="15" x2="1185" y2="90" stroke="#00ff88" stroke-width="3"/>

<line x1="15" y1="335" x2="90" y2="335" stroke="#00ff88" stroke-width="3"/>
<line x1="15" y1="335" x2="15" y2="260" stroke="#00ff88" stroke-width="3"/>

<line x1="1185" y1="335" x2="1110" y2="335" stroke="#00ff88" stroke-width="3"/>
<line x1="1185" y1="335" x2="1185" y2="260" stroke="#00ff88" stroke-width="3"/>

<!-- Scanline -->

<rect x="0" y="0" width="1200" height="16" fill="#00ff88" opacity=".12">
<animate attributeName="y"
values="-20;360"
dur="4s"
repeatCount="indefinite"/>
</rect>

<!-- Rotating Rings -->

<circle cx="600" cy="125" r="105"
fill="none"
stroke="#00ff88"
opacity=".25">

<animateTransform
attributeName="transform"
type="rotate"
from="0 600 125"
to="360 600 125"
dur="15s"
repeatCount="indefinite"/>

</circle>

<circle cx="600" cy="125" r="85"
fill="none"
stroke="#00d9ff"
opacity=".25">

<animateTransform
attributeName="transform"
type="rotate"
from="360 600 125"
to="0 600 125"
dur="10s"
repeatCount="indefinite"/>

</circle>

<!-- Access -->

<text x="600"
y="45"
text-anchor="middle"
class="term">

[ ACCESS GRANTED ]

</text>

<!-- Glitch Layers -->

<text x="603"
y="135"
text-anchor="middle"
font-size="64"
font-weight="bold"
fill="#ff0033"
opacity=".25">

JOBSY S

</text>

<text x="597"
y="135"
text-anchor="middle"
font-size="64"
font-weight="bold"
fill="#00d9ff"
opacity=".25">

JOBSY S

</text>

<!-- Main Name -->

<text
x="600"
y="135"
text-anchor="middle"
class="title">

JOBSY S

<animateTransform
attributeName="transform"
type="translate"
values="0 0;2 0;-2 0;0 0"
dur=".12s"
repeatCount="indefinite"/>

</text>

<!-- Subtitle -->

<text
x="600"
y="175"
text-anchor="middle"
class="sub">

Cybersecurity Researcher

</text>

<!-- Status -->

<text x="480" y="220" class="term">
STATUS : ONLINE
</text>

<circle cx="650" cy="214" r="6" fill="#00ff88">
<animate attributeName="opacity"
values="1;.2;1"
dur="1s"
repeatCount="indefinite"/>
</circle>

<!-- Threat Counter -->

<text x="480" y="250" class="term">
THREATS BLOCKED : 1337
</text>

<!-- Network Nodes -->

<circle cx="130" cy="80" r="4" fill="#00ff88"/>
<circle cx="220" cy="120" r="4" fill="#00ff88"/>
<circle cx="320" cy="70" r="4" fill="#00ff88"/>

<line x1="130" y1="80" x2="220" y2="120" stroke="#00ff88"/>
<line x1="220" y1="120" x2="320" y2="70" stroke="#00ff88"/>

<circle cx="220" cy="120" r="5" fill="#00ff88">
<animate attributeName="r"
values="5;8;5"
dur="1s"
repeatCount="indefinite"/>
</circle>

<!-- Terminal -->

<text x="90" y="260" class="term">
root@jobsy:~$ whoami
</text>

<text
x="90"
y="290"
font-family="monospace"
font-size="18"
fill="#00d9ff">

Security Researcher

</text>

<!-- Cursor -->

<rect x="315"
y="277"
width="10"
height="18"
fill="#00ff88">

<animate attributeName="opacity"
values="1;0;1"
dur="1s"
repeatCount="indefinite"/>

</rect>

<!-- Radar -->

<circle cx="1020" cy="145" r="70"
fill="none"
stroke="#00ff88"/>

<circle cx="1020" cy="145" r="50"
fill="none"
stroke="#00ff88"/>

<circle cx="1020" cy="145" r="30"
fill="none"
stroke="#00ff88"/>

<line
x1="1020"
y1="145"
x2="1090"
y2="145"
stroke="#00ff88"
stroke-width="2">

<animateTransform
attributeName="transform"
type="rotate"
from="0 1020 145"
to="360 1020 145"
dur="4s"
repeatCount="indefinite"/>

</line>

<!-- Threat Panel -->

<rect
x="840"
y="250"
width="290"
height="40"
fill="none"
stroke="#00ff88"/>

<text
x="860"
y="275"
class="small">

THREAT LEVEL : LOW

</text>

</svg>
