<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="50%" stop-color="#08121f"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Neon Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <style>

    .title{
      font-family:Arial, sans-serif;
      font-size:64px;
      font-weight:bold;
      fill:#00ff88;
      filter:url(#glow);
    }

    .subtitle{
      font-family:Courier New, monospace;
      font-size:24px;
      fill:#00d9ff;
    }

    .terminal{
      font-family:Courier New, monospace;
      font-size:18px;
      fill:#00ff88;
    }

    .binary{
      fill:#00ff88;
      opacity:0.12;
      font-size:14px;
      font-family:monospace;
    }

  </style>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.08">

    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00ff88" stroke-width="1"/>
      </pattern>
    </defs>

    <rect width="1200" height="320" fill="url(#grid)"/>

  </g>

  <!-- Matrix Rain -->

  <text x="40" class="binary">
    01010101 11001010 11101001
    <animate attributeName="y" values="-50;350" dur="8s" repeatCount="indefinite"/>
  </text>

  <text x="160" class="binary">
    11001100 10101010 01010111
    <animate attributeName="y" values="-200;350" dur="6s" repeatCount="indefinite"/>
  </text>

  <text x="280" class="binary">
    00110011 11110000 10101010
    <animate attributeName="y" values="-100;350" dur="9s" repeatCount="indefinite"/>
  </text>

  <text x="420" class="binary">
    11111100 01010101 10101010
    <animate attributeName="y" values="-180;350" dur="7s" repeatCount="indefinite"/>
  </text>

  <text x="560" class="binary">
    10011001 01010101 11111100
    <animate attributeName="y" values="-60;350" dur="10s" repeatCount="indefinite"/>
  </text>

  <text x="700" class="binary">
    01010101 11110000 11001100
    <animate attributeName="y" values="-150;350" dur="8s" repeatCount="indefinite"/>
  </text>

  <text x="840" class="binary">
    11001111 00001111 10101010
    <animate attributeName="y" values="-80;350" dur="6s" repeatCount="indefinite"/>
  </text>

  <text x="980" class="binary">
    11110000 10101010 00110011
    <animate attributeName="y" values="-170;350" dur="7s" repeatCount="indefinite"/>
  </text>

  <!-- Border -->
  <rect
    x="15"
    y="15"
    width="1170"
    height="290"
    rx="15"
    fill="none"
    stroke="#00ff88"
    stroke-width="2"
    opacity="0.7"/>

  <!-- Scanline -->
  <rect x="0" y="0" width="1200" height="20" fill="#00ff88" opacity="0.15">
    <animate attributeName="y" values="-30;340" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Access Granted -->
  <text
    x="600"
    y="55"
    text-anchor="middle"
    class="terminal">

    [ ACCESS GRANTED ]

  </text>

  <!-- Name -->
  <text
    x="600"
    y="145"
    text-anchor="middle"
    class="title">

    JOBSY S

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;2 0;-2 0;0 0"
      dur="0.15s"
      repeatCount="indefinite"/>

  </text>

  <!-- Subtitle -->
  <text
    x="600"
    y="190"
    text-anchor="middle"
    class="subtitle">

    Cybersecurity Researcher

  </text>

  <!-- Status -->
  <text
    x="530"
    y="245"
    class="terminal">

    STATUS : ONLINE

  </text>

  <circle
    cx="690"
    cy="239"
    r="6"
    fill="#00ff88">

    <animate
      attributeName="opacity"
      values="1;0.2;1"
      dur="1s"
      repeatCount="indefinite"/>

  </circle>

  <!-- Threat Counter -->
  <text
    x="530"
    y="275"
    class="terminal">

    THREATS BLOCKED : 1337

  </text>

</svg>
